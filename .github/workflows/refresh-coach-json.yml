name: Refresh agent coaching JSON

on:
  schedule:
    # Every 10 minutes. GitHub may delay cron under load, but this is the intended cadence.
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "garmin_coach.py"
      - "requirements.txt"
      - "config.js"
      - ".github/workflows/refresh-coach-json.yml"

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Extract Garmin key from config.js
        id: key
        run: |
          KEY=$(python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path("config.js").read_text()
          m = re.search(r"PERSONAL_API_KEY:\s*'([^']+)'", text)
          if not m:
              raise SystemExit("PERSONAL_API_KEY not found in config.js")
          print(m.group(1))
          PY
          )
          echo "::add-mask::$KEY"
          echo "value=$KEY" >> "$GITHUB_OUTPUT"

      - name: Fetch coaching snapshot through today (UTC)
        env:
          GARMIN_PERSONAL_API_KEY: ${{ steps.key.outputs.value }}
          TZ: UTC
        run: |
          END="$(date -u +%F)"
          echo "Fetching range ending ${END} (UTC today)"
          # Rolling last 14 days ending today — end date moves forward every run.
          python garmin_coach.py --days 14 --end "$END" -o coach.json
          cp coach.json agent.json
          python - <<'PY'
          import json
          from pathlib import Path
          from garmin_coach import to_agent_markdown
          snap = json.loads(Path("agent.json").read_text())
          Path("agent.md").write_text(to_agent_markdown(snap), encoding="utf-8")
          print("range", snap.get("range"))
          print("generated_at", snap.get("generated_at") or snap.get("fetched_at"))
          print("activities", len(snap.get("activities") or []))
          print("wrote agent.md", Path("agent.md").stat().st_size, "bytes")
          PY

      - name: Commit refreshed snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Always refresh the public agent artifacts, not only coach.json
          git add coach.json agent.json agent.md
          if git diff --staged --quiet; then
            echo "No content changes after fetch"
          else
            END="$(date -u +%F)"
            git commit -m "Refresh coaching snapshots through ${END}"
            git push
          fi
